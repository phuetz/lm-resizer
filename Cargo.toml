[workspace]
resolver = "2"
members = [
  ".",
  "bench",
  "crates/lm-resizer-core",
  "crates/lm-resizer-wasm",
]

[workspace.package]
edition = "2021"
rust-version = "1.86"
license = "Apache-2.0"
repository = "https://github.com/phuetz/lm-resizer"
authors = ["lm-resizer contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision", "raw_value"] }
bytes = "1"
thiserror = "1"
tracing = "0.1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs", "io-std", "io-util"] }
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

[package]
name = "lm-resizer"
version = "0.2.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Rust-native context compression layer for LLM agents."

[features]
default = []
# Real ONNX content detection (Google's `magika` crate). Forwards to
# `lm-resizer-core`. Off by default; even when compiled in, detection requires
# `LM_RESIZER_ENABLE_MAGIKA=1` at runtime. See lm-resizer-core/Cargo.toml.
magika = ["lm-resizer-core/magika"]

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { workspace = true }
flate2 = "1"
fs2 = "0.4"
futures-util = "0.3"
image = { version = "0.24.9", default-features = false, features = ["png", "jpeg"] }
lm-resizer-core = { path = "crates/lm-resizer-core" }
rayon = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { workspace = true }
regex = "1"
ring = "0.17"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
serde_yaml = "0.9"
yaml-edit = { version = "0.3.2", default-features = false }
tokio = { workspace = true }
tokio-tungstenite = "0.24"
toml = "0.8"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[[example]]
name = "perf"
path = "bench/perf/run.rs"
